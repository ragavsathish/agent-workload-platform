services:
  playwright-layout-amd64:
    profiles: [amd64]
    image: c4-gondolin-browser:playwright-mcp-0.0.79-amd64
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: adapters/c4-gondolin/Dockerfile.playwright

  playwright-layout-arm64:
    profiles: [arm64]
    image: c4-gondolin-browser:playwright-mcp-0.0.79-arm64
    platform: linux/arm64
    build:
      context: ../..
      dockerfile: adapters/c4-gondolin/Dockerfile.playwright
