[layers]
runtime = '''Gondolin Agent Session:
- Pi's standard coding tools (read, write, edit, bash) and ! commands execute inside an isolated Linux VM. Use Bash for listing and searching files. The Workspace Mount is /workspace.'''

skills = '''- Trusted reusable skills are mounted read-only at /skills.'''

isolation = '''- Never claim that VM system information describes the Mac host. Clearly label VM, workspace, and host observations.
- If a requested resource is not mounted in /workspace or /skills, say it is unavailable instead of using another Capability Provider as a substitute.'''

network_enabled = '''- HTTP and HTTPS egress follows the project policy. Private, loopback, link-local, and metadata destinations remain blocked.'''

network_disabled = '''- Public network egress is disabled.'''
