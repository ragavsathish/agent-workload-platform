<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src '__MCP_APP_BOOTSTRAP_HASH__' '__MCP_APP_SCRIPT_HASH__'; style-src 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'"
    >
    <title>Marp Slides</title>
    <script>__MCP_APP_BOOTSTRAP__</script>
    <style>__MCP_APP_CSS__</style>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--pi-color-canvas); color: var(--pi-color-text); }
      body { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
      #deck { min-height: 0; display: grid; place-items: center; overflow: hidden; padding: 10px; }
      #deck .marpit { width: 100%; height: 100%; display: grid; place-items: center; }
      #deck svg[data-marpit-svg] { display: none; width: 100%; height: 100%; max-height: calc(100vh - 54px); }
      #deck svg[data-marpit-svg][data-active] { display: block; }
      #controls { min-height: var(--pi-size-touch); justify-content: center; padding: var(--pi-space-2); border-top: 1px solid var(--pi-color-border); }
      #position { min-width: 64px; text-align: center; color: var(--pi-color-text-muted); font-size: var(--pi-font-small); }
      #error { margin: auto; color: var(--pi-color-danger); }
    </style>
  </head>
  <body>
    <main id="deck" aria-live="polite"></main>
    <nav id="controls" class="pi-toolbar" aria-label="Slide navigation" hidden>
      <button id="previous" class="pi-button pi-icon-button" type="button" aria-label="Previous slide">&#8592;</button>
      <span id="position" aria-live="polite"></span>
      <button id="next" class="pi-button pi-icon-button" type="button" aria-label="Next slide">&#8594;</button>
    </nav>
    <script>__MCP_APP_SCRIPT__</script>
  </body>
</html>
