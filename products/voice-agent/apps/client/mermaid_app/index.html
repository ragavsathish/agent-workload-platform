<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src '__MCP_APP_BOOTSTRAP_HASH__' '__MCP_APP_SCRIPT_HASH__'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'"
    >
    <title>Mermaid App</title>
    <script>document.documentElement.dataset.piTheme = new URLSearchParams(location.search).get('theme') || '';</script>
    <style>__MCP_APP_CSS__
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--pi-color-canvas); color: var(--pi-color-text); }
      #app { min-height: 100%; padding: var(--pi-space-4); }
      h1 { margin: 0; font-size: var(--pi-font-body); font-weight: 650; }
      .diagram { min-height: 120px; display: grid; place-items: center; overflow: auto; touch-action: pan-x pan-y pinch-zoom; }
      .diagram svg { display: block; max-width: 100%; height: auto; }
      .error { margin: auto; }
    </style>
  </head>
  <body>
    <main id="app" class="pi-stack" aria-live="polite"></main>
    <script>__MCP_APP_SCRIPT__</script>
  </body>
</html>
