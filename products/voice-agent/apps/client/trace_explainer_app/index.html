<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src '__MCP_APP_BOOTSTRAP_HASH__' '__MCP_APP_SCRIPT_HASH__'; style-src 'unsafe-inline'; img-src 'self'; font-src data:; connect-src 'none'"
    >
    <title>Playwright Trace Viewer</title>
    <script>__MCP_APP_BOOTSTRAP__</script>
    <style>__MCP_APP_CSS__</style>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; min-height: 100%; background: var(--pi-color-canvas); color: var(--pi-color-text); }
      body { padding: 10px; }
      button { font: inherit; }
      #app { width: 100%; max-width: 1440px; margin: 0 auto; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 54px; margin-bottom: 8px; }
      #eyebrow { display: none; }
      h1 { margin: 0; font-size: var(--pi-font-body); line-height: var(--pi-font-line); }
      #summary { margin: 2px 0 0; color: var(--pi-color-text-muted); font-size: var(--pi-font-small); }
      #fullscreen { flex: none; padding: 8px 11px; }
      #metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; margin-bottom: 8px; }
      .metric { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 9px 11px; border: 1px solid var(--pi-color-border); border-radius: var(--pi-radius-md); background: var(--pi-color-surface); }
      .metric span { color: var(--pi-color-text-muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .metric strong { color: var(--pi-color-text); font-size: 15px; }
      .metric.ok strong { color: var(--pi-color-accent); }
      .metric.error strong { color: var(--pi-color-danger); }
      #evidence { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(240px, .85fr); min-height: 300px; overflow: hidden; border: 1px solid var(--pi-color-border); border-radius: var(--pi-radius-lg); background: var(--pi-color-surface); }
      #preview { position: relative; display: grid; place-items: center; min-width: 0; overflow: hidden; background: var(--pi-color-canvas); }
      #preview img { display: block; width: 100%; height: 100%; max-height: 420px; object-fit: contain; }
      .preview-fallback { display: none; color: var(--pi-color-text-muted); font-size: 13px; }
      #preview.unavailable img { display: none; }
      #preview.unavailable .preview-fallback { display: block; }
      #timeline { min-width: 0; padding: 15px 14px; border-left: 1px solid var(--pi-color-border); background: var(--pi-color-surface-raised); }
      #timeline h2 { margin: 0 0 12px; color: var(--pi-color-text); font-size: 13px; }
      #timeline ol { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      #timeline li { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 8px; color: var(--pi-color-text); font-size: 11px; }
      #timeline li.empty { display: block; color: var(--pi-color-text-muted); }
      .action-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pi-color-accent); }
      li.error .action-dot { background: var(--pi-color-danger); }
      .action-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #timeline time { color: var(--pi-color-text-muted); font-family: var(--pi-font-mono); font-size: 10px; }
      #viewer-launch { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 8px; padding: 11px 13px; border: 1px solid var(--pi-color-border); border-radius: var(--pi-radius-md); background: var(--pi-color-surface-raised); }
      #viewer-launch p { max-width: 720px; margin: 0; color: var(--pi-color-text-muted); font-size: 12px; }
      #open-viewer { flex: none; padding: 11px 15px; font-weight: 700; }
      #conversation { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding-top: 9px; }
      .ask { padding: 7px 10px; }
      #conversation-status { color: var(--pi-color-text-muted); font-size: 12px; }
      #error { margin: 32px; color: var(--pi-color-danger); text-align: center; }
      @media (max-width: 620px) {
        body { padding: 7px; }
        #metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #evidence { grid-template-columns: 1fr; }
        #preview { min-height: 190px; }
        #timeline { border-top: 1px solid var(--pi-color-border); border-left: 0; }
        #viewer-launch { align-items: stretch; flex-direction: column; }
        #fullscreen { display: none; }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <script>__MCP_APP_SCRIPT__</script>
  </body>
</html>
