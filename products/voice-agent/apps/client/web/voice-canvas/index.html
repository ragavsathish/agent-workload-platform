<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Voice Canvas</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0a0e12; color: #eef7f2; }
    body { padding: 18px; }
    h1 { margin: 0 0 18px; font-size: 16px; font-weight: 600; }
    h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: #a9b8b1; }
    .voice-flow { display: flex; flex-direction: column; align-items: center; min-height: 260px; justify-content: center; }
    .voice-node { width: min(88%, 420px); min-height: 58px; display: grid; place-items: center; padding: 12px 18px; border: 1px solid #56645e; border-radius: 10px; background: #151b20; text-align: center; }
    .voice-edge { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #87a096; }
    .voice-arrow { font-size: 22px; line-height: 22px; }
    .voice-edge-label { max-width: 240px; color: #a9b8b1; font-size: 12px; text-align: center; }
    .voice-connections { margin-top: 18px; padding-top: 14px; border-top: 1px solid #252e35; }
    .voice-connections p { margin: 6px 0; color: #cbd7d1; font-size: 13px; }
  </style>
  <script src="mcp_app.js" type="module"></script>
  <script src="main.dart.js" defer></script>
</head>
<body>
  <main id="app" aria-live="polite"></main>
</body>
</html>
