[project]
name = "pipecat-isolated-edge"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "pipecat-ai[openai,rnnoise,runner,silero,webrtc]>=1.12,<2",
    "voxlock[pipecat]==1.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "UP"]

[tool.pyright]
extraPaths = ["../../packages/telemetry/src"]
