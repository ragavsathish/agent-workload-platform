[project]
name = "pipecat-task-worker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "absurd-sdk>=0.5,<0.6",
    "boto3>=1.40,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "opentelemetry-sdk>=1.38,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../packages/tasking/src", "../../packages/telemetry/src"]

[tool.pyright]
extraPaths = ["src", "../../packages/tasking/src", "../../packages/telemetry/src"]
