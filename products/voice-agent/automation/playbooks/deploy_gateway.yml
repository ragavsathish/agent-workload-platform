---
- name: Deploy the agent gateway after a targeted source change
  hosts: localhost
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Rebuild and converge the agent gateway container
      community.docker.docker_compose_v2:
        project_src: "{{ compose_project_src }}"
        files: "{{ compose_files }}"
        env_files: "{{ compose_env_files }}"
        project_name: "{{ compose_project_name }}"
        services: [agent-gateway]
        build: always
        recreate: always
        state: present
        wait: true
