---
- name: Run browser infrastructure tests
  hosts: localhost
  gather_facts: false
  vars:
    playwright_supported_projects:
      - voice
      - voice-telemetry
      - diagnostics
      - grafana
      - durable
      - durable-cli
    playwright_output_defaults:
      voice: /tmp/pipecat-playwright-voice
      voice-telemetry: /tmp/pipecat-playwright-voice-telemetry
      diagnostics: /tmp/pipecat-react-diagnostics
      grafana: /tmp/pipecat-grafana
      durable: /tmp/pipecat-durable
      durable-cli: /tmp/pipecat-durable-cli
  tasks:
    - name: Validate the requested browser project
      ansible.builtin.assert:
        that:
          - playwright_project is defined
          - playwright_project in playwright_supported_projects
        fail_msg: >-
          Set playwright_project to one of:
          {{ playwright_supported_projects | join(', ') }}.

    - name: Select browser test paths
      ansible.builtin.set_fact:
        playwright_output_dir: >-
          {{ lookup('ansible.builtin.env', 'PLAYWRIGHT_OUTPUT_DIR')
             | default(playwright_output_defaults[playwright_project], true) }}
        playwright_fixture: "{{ voice_agent_root }}/deploy/secrets/voxlock-voice-sample.wav"

    - name: Verify the recorded voice fixture exists
      ansible.builtin.stat:
        path: "{{ playwright_fixture }}"
      register: playwright_fixture_stat

    - name: Require the recorded voice fixture
      ansible.builtin.assert:
        that:
          - playwright_fixture_stat.stat.isreg | default(false)
          - playwright_fixture_stat.stat.size | default(0) > 0
        fail_msg: "Missing voice fixture: {{ playwright_fixture }}"

    - name: Create the browser artifact directory
      ansible.builtin.file:
        path: "{{ playwright_output_dir }}"
        state: directory
        mode: "0700"

    - name: Create a temporary voice audio path
      ansible.builtin.tempfile:
        state: file
        suffix: .wav
      register: playwright_audio_temp
      when: playwright_project in ['voice', 'voice-telemetry']

    - name: Build the voice browser fixture
      ansible.builtin.command:
        argv:
          - ffmpeg
          - -hide_banner
          - -loglevel
          - error
          - -f
          - lavfi
          - -t
          - "10"
          - -i
          - anullsrc=r=16000:cl=mono
          - -i
          - "{{ playwright_fixture }}"
          - -filter_complex
          - "[1:a]volume=12dB[voice];[0:a][voice]concat=n=2:v=0:a=1[out]"
          - -map
          - "[out]"
          - -c:a
          - pcm_s16le
          - -ar
          - "16000"
          - -ac
          - "1"
          - -y
          - "{{ playwright_audio_temp.path }}"
      changed_when: true
      when: playwright_project in ['voice', 'voice-telemetry']

    - name: Fetch a real trace for the voice browser test
      ansible.builtin.command:
        argv:
          - python3
          - "{{ voice_agent_root }}/tests/e2e/grafana-mcp.py"
      register: playwright_trace_probe
      changed_when: false
      when: playwright_project == 'voice'
      no_log: true

    - name: Select the browser test inputs
      ansible.builtin.set_fact:
        playwright_audio_file: >-
          {{ playwright_audio_temp.path
             if playwright_project in ['voice', 'voice-telemetry']
             else playwright_fixture }}
        playwright_trace_id: >-
          {{ (playwright_trace_probe.stdout | from_json).traceId
             if playwright_project == 'voice'
             else '' }}
      no_log: true

    - name: Require a trace for the voice browser test
      ansible.builtin.assert:
        that:
          - playwright_trace_id | length > 0
          - playwright_trace_id != 'null'
        fail_msg: Grafana did not return a trace for the voice browser test.
      when: playwright_project == 'voice'

    - name: Run the browser test with its network bridge
      block:
        - name: Require an owner identity for the native CLI journey
          ansible.builtin.assert:
            that:
              - lookup('ansible.builtin.env', 'DURABLE_CLI_TEST_IDENTITY') | length > 2
            fail_msg: Set DURABLE_CLI_TEST_IDENTITY to the login used in the Flutter web UI.
          when: playwright_project == 'durable-cli'

        - name: Select a unique native CLI proof marker
          ansible.builtin.set_fact:
            durable_cli_marker: "cli-e2e-{{ 99999999 | random }}"
          when: playwright_project == 'durable-cli'

        - name: Submit native Pi Durable work through the local CLI
          ansible.builtin.command:
            argv:
              - node
              - "{{ voice_agent_root }}/../../platform/agent-execution/pi-durable-task/dist/cli.js"
              - submit
              - --identity
              - "{{ lookup('ansible.builtin.env', 'DURABLE_CLI_TEST_IDENTITY') }}"
              - --workspace
              - scratch
              - --instruction
              - >-
                In this scratch workspace, create {{ durable_cli_marker }}.txt containing
                exactly {{ durable_cli_marker }} followed by a newline. Verify the file
                contents, then report completion. Do not access the network or modify files
                other than those requested here.
                {{ 'Also run uname -s and create execution-os.txt containing its exact output followed by a newline.'
                   if lookup('ansible.builtin.env', 'DURABLE_CLI_EXPECT_OS') | length > 0 else '' }}
          register: durable_cli_submission
          changed_when: true
          when: playwright_project == 'durable-cli'

        - name: Record the native task ID for the browser journey
          ansible.builtin.set_fact:
            durable_cli_task_id: "{{ (durable_cli_submission.stdout | from_json).task_id }}"
          when: playwright_project == 'durable-cli'

        - name: Start the browser tailnet bridge
          community.docker.docker_compose_v2:
            project_src: "{{ compose_project_src }}"
            project_name: "{{ compose_project_name }}"
            files:
              - compose.yml
              - compose.playwright.yml
            env_files:
              - .env
            profiles:
              - e2e
            services:
              - e2e-tailnet-bridge
            dependencies: false
            state: present
          environment:
            PLAYWRIGHT_AUDIO_FILE: "{{ playwright_audio_file }}"
            PLAYWRIGHT_OUTPUT_DIR: "{{ playwright_output_dir }}"
            GRAFANA_TRACE_ID: "{{ playwright_trace_id }}"

        - name: Run the selected Playwright project
          community.docker.docker_compose_v2_run:
            project_src: "{{ compose_project_src }}"
            project_name: "{{ compose_project_name }}"
            files:
              - compose.yml
              - compose.playwright.yml
            env_files:
              - .env
            profiles:
              - e2e
            service: playwright-e2e
            cleanup: true
            no_deps: true
            env:
              PLAYWRIGHT_PROJECT: "{{ playwright_project }}"
              DURABLE_CLI_TEST_TASK_ID: "{{ durable_cli_task_id | default('') }}"
              DURABLE_CLI_TEST_MARKER: "{{ durable_cli_marker | default('') }}"
              DURABLE_CLI_EXPECT_OS: "{{ lookup('ansible.builtin.env', 'DURABLE_CLI_EXPECT_OS') }}"
          environment:
            PLAYWRIGHT_AUDIO_FILE: "{{ playwright_audio_file }}"
            PLAYWRIGHT_OUTPUT_DIR: "{{ playwright_output_dir }}"
            GRAFANA_TRACE_ID: "{{ playwright_trace_id }}"
          changed_when: false
      always:
        - name: Remove the browser tailnet bridge
          community.docker.docker_container:
            name: "{{ compose_project_name }}-e2e-tailnet-bridge-1"
            state: absent
            force_kill: true

        - name: Remove the generated voice fixture
          ansible.builtin.file:
            path: "{{ playwright_audio_temp.path }}"
            state: absent
          when: playwright_project in ['voice', 'voice-telemetry']
