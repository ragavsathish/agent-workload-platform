[package]
name = "voice-personal-knowledge-gateway-http"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
spin-executor = "3.0.1"
spin-sdk = "3.0.1"
urlencoding = "2.1.3"
wit-bindgen = "0.41.0"

[lib]
crate-type = ["cdylib"]
path = "src/gateway-http/lib.rs"

[profile.release]
codegen-units = 1
opt-level = "s"
debug = false
strip = true
lto = true

[workspace]
