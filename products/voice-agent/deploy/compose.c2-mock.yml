services:
  c2-container-mock:
    image: babashka/babashka:1.13.219
    working_dir: /tool
    command: ["bb", "-cp", "/tool", "/tool/patrol_fixture_server.clj"]
    environment:
      PATROL_FIXTURE_HOST: 0.0.0.0
      PATROL_FIXTURE_PORT: "8766"
      PATROL_C2_SCENARIO_FILE: /tool/c2_journal_scenario.json
    volumes:
      - ../apps/client/tool:/tool:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    restart: "no"

  playwright-c2-e2e:
    image: pipecat-playwright-allure:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.playwright-allure
    depends_on:
      - c2-container-mock
    environment:
      NODE_PATH: /tests/node_modules:/app/node_modules
      VOICE_E2E_URL: http://c2-container-mock:8766
      VOICE_E2E_OUTPUT: /output
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec node /tests/node_modules/playwright/cli.js test
        --config=/tests/source/playwright.config.ts
        --project=${PLAYWRIGHT_C2_PROJECT:?set PLAYWRIGHT_C2_PROJECT}
    volumes:
      - ../tests/e2e/playwright.config.ts:/tests/source/playwright.config.ts:ro
      - ../tests/e2e/playwright:/tests/source/playwright:ro
      - ${PLAYWRIGHT_OUTPUT_DIR:?set PLAYWRIGHT_OUTPUT_DIR}:/output
    read_only: true
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=512m"
      - "/home/node:rw,nosuid,nodev,size=128m,uid=1000,gid=1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    restart: "no"
