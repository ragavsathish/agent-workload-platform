services:
  e2e-tailnet-bridge:
    image: mcr.microsoft.com/playwright/mcp:v0.0.79@sha256:18c0a9c934004fe9580cc79f1e8e6e6cde7c667348b215335e8a23fd3e509804
    profiles: [e2e]
    network_mode: service:tailscale
    user: "0:0"
    entrypoint: ["node", "-e"]
    command:
      - |
        const net = require('node:net');
        const os = require('node:os');
        const tailnetAddress = Object.values(os.networkInterfaces())
          .flat()
          .find((entry) => entry && entry.family === 'IPv4' && entry.address.startsWith('100.'))
          ?.address;
        if (!tailnetAddress) throw new Error('Tailscale IPv4 address was not found');
        const server = net.createServer((downstream) => {
          const upstream = net.connect(443, tailnetAddress);
          downstream.pipe(upstream);
          upstream.pipe(downstream);
          const close = () => {
            downstream.destroy();
            upstream.destroy();
          };
          downstream.on('error', close);
          upstream.on('error', close);
        });
        server.listen(443, '172.30.90.2', () => {
          console.log(`Forwarding 172.30.90.2:443 to $${tailnetAddress}:443`);
        });
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    restart: "no"

  playwright-e2e:
    image: mcr.microsoft.com/playwright/mcp:v0.0.79@sha256:18c0a9c934004fe9580cc79f1e8e6e6cde7c667348b215335e8a23fd3e509804
    profiles: [e2e]
    networks: [control]
    extra_hosts:
      - "pipecat-edge.tailf6d713.ts.net:172.30.90.2"
    environment:
      NODE_PATH: /app/node_modules
      PLAYWRIGHT_PROJECT: voice
      VOICE_E2E_URL: https://pipecat-edge.tailf6d713.ts.net
      VOICE_E2E_AUDIO: /fixtures/voice.wav
      VOICE_E2E_OUTPUT: /output
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec node /app/node_modules/playwright/cli.js test
        --config=/tests/playwright.config.ts
        --project="$${PLAYWRIGHT_PROJECT:-voice}"
    volumes:
      - ../tests/e2e:/tests:ro
      - ${PLAYWRIGHT_AUDIO_FILE:?set PLAYWRIGHT_AUDIO_FILE}:/fixtures/voice.wav:ro
      - ${PLAYWRIGHT_OUTPUT_DIR:?set PLAYWRIGHT_OUTPUT_DIR}:/output
    read_only: true
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=512m"
      - "/home/node:rw,nosuid,nodev,size=128m,uid=1000,gid=1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    restart: "no"
