service:
  flush: 1
  log_level: info

pipeline:
  inputs:
    - name: node_exporter_metrics
      tag: system_metrics
      scrape_interval: 5
      path.procfs: /host/proc
      path.sysfs: /host/sys
      metrics: cpu,meminfo,loadavg,diskstats,netdev,stat,vmstat

  outputs:
    - name: prometheus_exporter
      match: system_metrics
      host: 0.0.0.0
      port: 2021
      add_label:
        - system docker-desktop-vm
        - layer vm
