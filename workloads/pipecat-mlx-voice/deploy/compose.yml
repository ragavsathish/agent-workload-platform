services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: voice_agents
      POSTGRES_USER: voice_agents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - voice-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_agents -d voice_agents"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  voice-agent-postgres:
