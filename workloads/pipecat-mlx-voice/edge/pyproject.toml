[project]
name = "pipecat-isolated-edge"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28,<1",
    "pipecat-ai[openai,runner,silero,websocket]>=1.12,<2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "UP"]
